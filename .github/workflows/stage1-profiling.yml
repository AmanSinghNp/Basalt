name: Stage 1 Profiling Dossier

on:
  workflow_dispatch:

jobs:
  profile-stage1:
    name: Profile Stage 1 (Linux, Release)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential linux-tools-common linux-tools-generic
        sudo apt-get install -y "linux-tools-$(uname -r)" || true

    - name: Resolve perf Binary
      run: |
        PERF_BIN=""
        if command -v perf >/dev/null 2>&1; then
          PERF_BIN="$(command -v perf)"
        fi
        if [ -z "$PERF_BIN" ] && [ -x "/usr/lib/linux-tools/$(uname -r)/perf" ]; then
          PERF_BIN="/usr/lib/linux-tools/$(uname -r)/perf"
        fi
        if [ -z "$PERF_BIN" ] && [ -x "/usr/lib/linux-tools-$(uname -r)/perf" ]; then
          PERF_BIN="/usr/lib/linux-tools-$(uname -r)/perf"
        fi
        if [ -z "$PERF_BIN" ]; then
          PERF_BIN="$(ls /usr/lib/linux-tools*/perf 2>/dev/null | head -n 1 || true)"
        fi
        echo "PERF_BIN=$PERF_BIN" >> "$GITHUB_ENV"
        if [ -n "$PERF_BIN" ] && [ -x "$PERF_BIN" ]; then
          "$PERF_BIN" --version || true
        else
          echo "perf binary could not be resolved; fallback behavior will be used."
        fi

    - name: Configure CMake
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run Tests
      run: |
        ctest --test-dir build --output-on-failure

    - name: Run Stage 1 Profiling
      run: |
        bash tools/profiling/run_stage1.sh \
          --bench-bin ./build/basalt_bench \
          --out-root ./artifacts/stage1 \
          --size 1024 \
          --shots 100 \
          --warmup 5 \
          --seed 1337 \
          --perf-repeats 3

    - name: Upload Stage 1 Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: stage1-profiling-dossier
        path: artifacts/stage1/
        if-no-files-found: error
